# .azure/templates/external-test-job.yml
# Lean test job for external/LLM-hitting tests: just env setup + pytest run
# + publish. No disk cleanup, no Ollama - this job doesn't need either.
parameters:
- name: includeReleaseCandidates
  type: boolean
  default: false
- name: showCapture
  type: string
  default: 'stdout'

steps:
- template: steps/setup-env.yml
  parameters:
    includeReleaseCandidates: ${{ parameters.includeReleaseCandidates }}
    uvExtras: '--extra dev'
    notebookTesting: false

- script: |
    uv run pytest toponymy/tests -m external --show-capture=${{ parameters.showCapture }} -v --disable-warnings --junitxml=junit/test-results.xml --cov=toponymy/ --cov-report=xml --cov-report=html
  displayName: 'Run external tests'
  env:
    CI: 'true'
    AZURE_PIPELINES: 'true'
    OPENAI_API_KEY: $(OPENAI_API_KEY)

- template: steps/publish-test-results.yml
