# .azure/templates/steps/free-disk-space.yml
# Frees up agent disk space before a heavy test run (large model/deps
# downloads). Only needed by jobs that install Ollama/large extras - the
# lean external-tests job does not include this.
steps:
- script: |
    echo "=== Initial disk space check ==="
    df -h /
    echo "=== Freeing up disk space ==="
    # Remove cached packages and temp files from previous runs
    sudo rm -rf ~/.cache/pip ~/.cache/huggingface ~/.cache/torch ~/.ollama /tmp/* || true
    # Remove old Docker images if any (Azure agents sometimes have these)
    docker system prune -af || true
    # Remove old package caches
    sudo apt-get clean || true
    echo "=== Disk space after cleanup ==="
    df -h /
  displayName: 'Free up disk space'
  continueOnError: true

- script: echo "Build reason is $(Build.Reason)"
  displayName: 'Print build reason'
