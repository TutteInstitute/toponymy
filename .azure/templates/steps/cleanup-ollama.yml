# .azure/templates/steps/cleanup-ollama.yml
# Stops any Ollama server process started by setup-ollama.yml. Only include
# this in jobs that also include setup-ollama.yml.
parameters:
- name: installOllama
  type: boolean
  default: false

steps:
- ${{ if eq(parameters.installOllama, true) }}:
  - script: |
      echo "Cleaning up Ollama processes..."
      pkill -f "ollama serve" || echo "No Ollama processes to clean up"
      echo "Ollama cleanup complete"
    displayName: 'Cleanup Ollama processes'
    condition: and(always(), eq(variables['Agent.OS'], 'Linux'))
    continueOnError: true