# .azure/templates/steps/inspect-disk.yml
# Disk usage snapshot, for diagnosing disk-space failures on heavy jobs.
# `label` distinguishes pre/post-test output in the step log.
parameters:
- name: label
  type: string
  default: 'tests'

steps:
- script: |
    echo "== disk (${{ parameters.label }}) =="
    df -h /
    du -h --max-depth=2 . | sort -hr | head -n 20
    echo "== site-packages =="
    du -sh ./venv/lib/python*/site-packages/* 2>/dev/null | sort -rh | head -20 || true
    echo "== cache dirs =="
    du -h --max-depth=2 ~/.cache | sort -hr | head -n 20
  displayName: 'Inspect disk usage (${{ parameters.label }})'
