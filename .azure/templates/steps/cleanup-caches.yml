# .azure/templates/steps/cleanup-caches.yml
# Final cache/temp cleanup so the agent disk is left tidy. Only needed by
# jobs heavy enough to have triggered free-disk-space.yml/setup-ollama.yml.
steps:
- script: |
    echo "=== cleanup disk usage ==="
    df -h /
    rm -rf ~/.cache/huggingface ~/.cache/torch ~/.cache/pip ~/.cache/ollama ~/.ollama /tmp/*
    df -h /
  displayName: 'Cleanup caches and temporary files'
  condition: always()
