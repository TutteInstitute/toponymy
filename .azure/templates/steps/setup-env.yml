# .azure/templates/steps/setup-env.yml
# Installs Python, uv, project dependencies, and registers the notebook kernel.

parameters:
- name: includeReleaseCandidates
  type: boolean
  default: false
- name: uvExtras
  type: string
  default: '--extra dev --extra llama'
- name: notebookTesting
  type: boolean
  default: true

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    python -m pip install -U uv
  displayName: 'Install uv'

# Temporarily disable cache to avoid disk space issues
# - task: Cache@2
#   inputs:
#     key: '"uv" | "$(Agent.OS)" | "$(python.version)" | uv.lock'
#     path: .venv
#   displayName: 'Cache virtualenv'
#   continueOnError: true

- script: |
    uv sync --python $(python.version) ${{ parameters.uvExtras }}
  displayName: 'Install dependencies'
  condition: ${{ eq(parameters.includeReleaseCandidates, false) }}

- script: |
    uv sync --python $(python.version) ${{ parameters.uvExtras }} --prerelease allow
  displayName: 'Install dependencies (allow pre-releases)'
  condition: ${{ eq(parameters.includeReleaseCandidates, true) }}

- ${{ if eq(parameters.notebookTesting, true) }}:
  - script: |
      uv run python -m ipykernel install --user --name toponymy-uv
    displayName: 'Install environment as a notebook kernel'
