# .azure/templates/notebook-test-job.yml
# Notebook test job: env setup, disk cleanup, optional Ollama integration setup,
# pytest run for notebook tests, and cleanup. 
parameters:
- name: includeReleaseCandidates
  type: boolean
  default: false
- name: installOllama
  type: boolean
  default: false
- name: showCapture
  type: string
  default: 'no'


steps:
- template: steps/free-disk-space.yml

- template: steps/setup-env.yml
  parameters:
    includeReleaseCandidates: ${{ parameters.includeReleaseCandidates }}

- template: steps/setup-ollama.yml
  parameters:
    installOllama: ${{ parameters.installOllama }}

- template: steps/inspect-disk.yml
  parameters:
    label: 'pre-tests'

- script: |
    uv run pytest toponymy/tests/test_doc_notebooks.py --show-capture=${{ parameters.showCapture }} -v --disable-warnings --junitxml=junit/test-results.xml --cov=toponymy/ --cov-report=xml --cov-report=html
  displayName: 'Run notebook tests'
  env:
    CI: 'true'
    AZURE_PIPELINES: 'true'

- template: steps/cleanup-ollama.yml
  parameters:
    installOllama: ${{ parameters.installOllama }}

- template: steps/inspect-disk.yml
  parameters:
    label: 'post-tests'

- template: steps/publish-test-results.yml

- template: steps/cleanup-caches.yml
