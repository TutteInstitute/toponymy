# .azure/templates/pr-test-job.yml
# PR test job: env setup, disk cleanup, optional Ollama integration setup,
# pytest run, and cleanup.

parameters:
- name: includeReleaseCandidates
  type: boolean
  default: false
- name: installOllama
  type: boolean
  default: false
- name: showCapture
  type: string
  default: 'no'

steps:
- template: steps/free-disk-space.yml

- template: steps/setup-env.yml
  parameters:
    includeReleaseCandidates: ${{ parameters.includeReleaseCandidates }}

- template: steps/setup-ollama.yml
  parameters:
    installOllama: ${{ parameters.installOllama }}

- template: steps/inspect-disk.yml
  parameters:
    label: 'pre-tests'

- bash: |
    echo "CHANGED_NOTEBOOKS as seen in PRTests job: '$CHANGED_NOTEBOOKS'"
  displayName: 'DEBUG: confirm job variable'
  env:
    CHANGED_NOTEBOOKS: $(CHANGED_NOTEBOOKS)

- script: |
    uv run pytest toponymy/tests -m "not external" -v --show-capture=${{ parameters.showCapture }} --disable-warnings --junitxml=junit/test-results.xml --cov=toponymy/ --cov-report=xml --cov-report=html
  displayName: 'Run PR tests'
  env:
    CI: 'true'
    AZURE_PIPELINES: 'true'
    CHANGED_NOTEBOOKS: $(CHANGED_NOTEBOOKS)

- template: steps/cleanup-ollama.yml
  parameters:
    installOllama: ${{ parameters.installOllama }}

- template: steps/inspect-disk.yml
  parameters:
    label: 'post-tests'

- template: steps/publish-test-results.yml

- template: steps/cleanup-caches.yml
