name: Publish release to PyPI

on:
  push:
    tags:
    - 'release-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
    permissions:
      contents: read

  build:
    needs:
    - tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: '3.12'
        enable-cache: false
    - name: Check tag matches package version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#release-}"
        PACKAGE_VERSION="$(uv version --short)"
        if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
          echo "::error::Version in git tag is ${TAG_VERSION} but package has version ${PACKAGE_VERSION}"
          exit 1
        fi
    - name: Build source distribution and wheel
      run: uv build --no-sources --sdist --wheel
    - name: Check distributions
      run: uvx twine check dist/*
    - name: Upload distributions as artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
    - name: Download distributions artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Generate PEP 740 attestations
      uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
    - name: Publish
      run: uv publish --trusted-publishing always
