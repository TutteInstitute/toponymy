name: Run tests

on:
  workflow_dispatch:
    inputs:
      includeReleaseCandidates:
        description: Allow pre-release dependencies
        type: boolean
        default: false
  workflow_call:
    inputs:
      includeReleaseCandidates:
        description: Allow pre-release dependencies
        type: boolean
        default: false
      run-platform-tests:
        description: Run the non-external test matrix when called by another workflow
        type: boolean
        default: true
    secrets:
      OPENAI_API_KEY:
        required: false
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    - annotation
    paths:
    - '**'
    - '!doc/**'
    - '!README.rst'
    - 'doc/*.ipynb'
  schedule:
  - cron: '0 3 * * *'
  - cron: '0 4 * * 6'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  UV_NO_CACHE: 'true'

jobs:
  CheckBlackFormatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv and set Python version to 3.12
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: '3.12'
        enable-cache: false
    - name: Install dependencies
      env:
        INCLUDE_RELEASE_CANDIDATES: ${{ inputs.includeReleaseCandidates || false }}
      run: |
        args=(--extra dev --python 3.12)
        if [[ "$INCLUDE_RELEASE_CANDIDATES" == "true" ]]; then
          args+=(--prerelease allow)
        fi
        uv sync "${args[@]}"
    - name: Check Black formatting
      run: uv run black --check --diff --target-version py310 toponymy/ doc/

  PrepareTests:
    runs-on: ubuntu-latest
    outputs:
      changed-notebooks: ${{ steps.notebooks.outputs.changed-notebooks }}
    steps:
    - name: Checkout PR history
      if: github.event_name == 'pull_request'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Detect changed notebooks
      if: github.event_name == 'pull_request'
      id: notebooks
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        python3 - <<'PY'
        import os
        import subprocess
        from pathlib import PurePosixPath

        paths = subprocess.check_output([
            "git", "diff", "--name-only", "-z", "--diff-filter=ACMR",
            f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}",
            "--", "doc/*.ipynb",
        ]).decode().split("\0")
        names = [PurePosixPath(path).name for path in paths if path]
        if any(any(char in name for char in ",\r\n") for name in names):
            raise ValueError("Changed notebook names cannot contain commas or newlines")
        changed = ",".join(names)
        print(f"Changed notebooks: {changed}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"changed-notebooks={changed}\n")
        PY

  RunAllTests-run_platform_tests:
    name: Tests - ${{ matrix.image-name }} - Python ${{ matrix.python-version }}
    needs:
    - PrepareTests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.run-platform-tests
    strategy:
      fail-fast: false
      matrix:
        image-name: [ubuntu-latest, windows-latest, macos-latest, ubuntu-26.04-arm]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    uses: ./.github/workflows/test-job.yml
    with:
      image-name: ${{ matrix.image-name }}
      python-version: ${{ matrix.python-version }}
      suite: pr
      includeReleaseCandidates: ${{ inputs.includeReleaseCandidates || false }}
      changed-notebooks: ${{ needs.PrepareTests.outputs.changed-notebooks }}

  NotebookTests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 6')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    uses: ./.github/workflows/test-job.yml
    with:
      image-name: ubuntu-latest
      python-version: ${{ matrix.python-version }}
      suite: notebooks
      includeReleaseCandidates: ${{ inputs.includeReleaseCandidates || false }}

  ExternalTests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    uses: ./.github/workflows/test-job.yml
    with:
      image-name: ubuntu-latest
      python-version: "3.11"
      suite: external
      timeout-minutes: 30
      includeReleaseCandidates: ${{ inputs.includeReleaseCandidates || false }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
